<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#151713">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="P45 Planner">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Powerpump Training Planner</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon-192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">P45</span>
        <div>
          <h1>Powerpump Planner</h1>
          <p>แผนฝึกจากคลิป @powerpump45</p>
        </div>
      </div>
      <div class="top-actions">
        <button id="installApp" class="install-button" type="button" hidden><i data-lucide="download"></i><span>Install</span></button>
        <div class="summary" aria-label="summary">
          <div><strong id="totalDrills">0</strong><span>drills</span></div>
          <div><strong id="doneCount">0</strong><span>done</span></div>
          <div><strong id="weekMinutes">0</strong><span>min/sun</span></div>
        </div>
      </div>
    </header>

    <main>
      <section class="control-band" aria-label="planner controls">
        <div class="tabs" role="tablist" aria-label="views">
          <button class="tab active" type="button" data-view="today"><i data-lucide="calendar-days"></i><span>วันนี้</span></button>
          <button class="tab" type="button" data-view="library"><i data-lucide="dumbbell"></i><span>คลังท่า</span></button>
          <button class="tab" type="button" data-view="journal"><i data-lucide="notebook-pen"></i><span>บันทึก</span></button>
        </div>
        <label class="search">
          <i data-lucide="search"></i>
          <input id="searchInput" type="search" placeholder="ค้นหาท่า หมวด หรือ hashtag">
        </label>
      </section>

      <section id="todayView" class="view active" aria-label="today plan">
        <div class="section-head">
          <div>
            <h2>เลือกแผนฝึกวันอาทิตย์</h2>
            <p id="todayLabel">เลือกแบบที่ตรงกับสภาพร่างกายของอาทิตย์นี้</p>
          </div>
          <button id="resetToday" class="icon-button" type="button" title="ล้าง checklist"><i data-lucide="rotate-ccw"></i></button>
        </div>
        <div class="plan-meter" aria-label="selected plan progress">
          <div>
            <span>Progress</span>
            <strong id="planProgressText">0 / 0</strong>
          </div>
          <div class="meter-track"><span id="planProgressBar"></span></div>
        </div>
        <div id="weekStrip" class="week-strip"></div>
        <div id="todayPlan" class="drill-grid compact"></div>
        <div class="check-panel">
          <h3>Checklist</h3>
          <div id="checklist"></div>
        </div>
      </section>

      <section id="libraryView" class="view" aria-label="drill library">
        <div class="section-head">
          <div>
            <h2>คลังแบบฝึก</h2>
            <p>คัดจาก caption, hashtag และ metadata ที่เก็บได้</p>
          </div>
          <div class="filter-row">
            <select id="participantFilter" aria-label="solo or partner filter">
              <option value="Solo">Solo only</option>
              <option value="All">All drills</option>
              <option value="Partner">Partner needed</option>
            </select>
            <select id="levelFilter" aria-label="level filter">
              <option value="All">All levels</option>
            </select>
            <select id="categoryFilter" aria-label="category filter">
              <option value="All">All categories</option>
            </select>
          </div>
        </div>
        <div id="levelStats" class="level-stats"></div>
        <div id="categoryStats" class="category-stats"></div>
        <div id="drillGrid" class="drill-grid"></div>
      </section>

      <section id="journalView" class="view" aria-label="journal">
        <div class="section-head">
          <div>
            <h2>Training Journal</h2>
            <p>บันทึกนี้เก็บใน browser เครื่องที่เปิดอยู่</p>
          </div>
          <button id="saveJournal" class="primary-button" type="button"><i data-lucide="save"></i><span>Save</span></button>
        </div>
        <form class="journal-form">
          <label>
            วันที่
            <input id="journalDate" type="date">
          </label>
          <label>
            ความพร้อม
            <select id="readiness">
              <option value="good">พร้อม</option>
              <option value="medium">กลาง</option>
              <option value="low">ล้า</option>
            </select>
          </label>
          <label>
            สิ่งที่ฝึก
            <input id="journalFocus" type="text" placeholder="Power, Agility, Mobility">
          </label>
          <label class="wide">
            Note
            <textarea id="journalNote" rows="7" placeholder="คุณภาพท่า ความเร็ว อาการล้า จุดที่ต้องแก้"></textarea>
          </label>
        </form>
        <div id="journalEntries" class="journal-list"></div>
      </section>
    </main>

    <template id="drillCardTemplate">
      <article class="drill-card">
        <div class="media">
          <img alt="" loading="lazy">
          <div class="media-fallback"></div>
          <span class="badge"></span>
          <span class="level-badge"></span>
        </div>
        <div class="drill-body">
          <div class="drill-title-row">
            <h3></h3>
            <button class="check-button" type="button" title="ทำเสร็จแล้ว"><i data-lucide="check"></i></button>
          </div>
          <p class="goal"></p>
          <div class="meta"></div>
          <div class="focus"></div>
          <div class="actions">
            <span class="gif-state"></span>
          </div>
        </div>
      </article>
    </template>

  </body>
</html>
