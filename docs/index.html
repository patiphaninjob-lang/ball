<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#151713">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="P45 Planner">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Powerpump Training Planner</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon-192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">P45</span>
        <div>
          <h1>Powerpump Planner</h1>
          <p>แผนฝึกจากคลิป @powerpump45</p>
        </div>
      </div>
      <div class="top-actions">
        <button id="installApp" class="install-button" type="button" hidden><i data-lucide="download"></i><span>Install</span></button>
        <div class="summary" aria-label="summary">
          <div><strong id="totalDrills">0</strong><span>drills</span></div>
          <div><strong id="doneCount">0</strong><span>done</span></div>
          <div><strong id="weekMinutes">0</strong><span>min/sun</span></div>
        </div>
      </div>
    </header>

    <main>
      <section class="control-band" aria-label="planner controls">
        <div class="tabs" role="tablist" aria-label="views">
          <button class="tab active" type="button" data-view="exercises"><i data-lucide="video"></i><span>ท่าฝึก</span></button>
        </div>
        <label class="search">
          <i data-lucide="search"></i>
          <input id="searchInput" type="search" placeholder="ค้นหาท่า หมวด หรือ hashtag">
        </label>
      </section>


      <section id="exercisesView" class="view active" aria-label="exercise library">
        <div class="section-head">
          <div>
            <h2>ท่าฝึก (270 Video Clips)</h2>
            <p>ท่าฝึกแยกจากวิดีโอแต่ละท่า พร้อมจำแนกตามประเภท</p>
          </div>
          <div class="filter-row">
            <select id="exerciseCategoryFilter" aria-label="exercise category filter">
              <option value="All">All Categories</option>
              <option value="Power">Power (70)</option>
              <option value="Agility">Agility (36)</option>
              <option value="Rehab">Rehab (29)</option>
              <option value="Core">Core (20)</option>
              <option value="Football Skill">Football (19)</option>
              <option value="Strength">Strength (18)</option>
              <option value="Mobility">Mobility (4)</option>
              <option value="Deceleration">Deceleration (2)</option>
            </select>
            <select id="exerciseLevelFilter" aria-label="exercise level filter">
              <option value="All">All Levels</option>
              <option value="Level 1">Level 1 (33)</option>
              <option value="Level 2">Level 2 (92)</option>
              <option value="Level 3">Level 3 (29)</option>
              <option value="Level 4">Level 4 (89)</option>
              <option value="Level 5">Level 5 (27)</option>
            </select>
          </div>
        </div>
        <div id="exercisesGrid" class="exercise-grid"></div>
      </section>



    </main>

    <template id="drillCardTemplate">
      <article class="drill-card">
        <div class="media">
          <img alt="" loading="lazy">
          <div class="media-fallback"></div>
          <span class="badge"></span>
          <span class="level-badge"></span>
        </div>
        <div class="drill-body">
          <div class="drill-title-row">
            <h3></h3>
            <button class="check-button" type="button" title="ทำเสร็จแล้ว"><i data-lucide="check"></i></button>
          </div>
          <p class="goal"></p>
          <div class="meta"></div>
          <div class="focus"></div>
          <div class="actions">
            <span class="gif-state"></span>
          </div>
        </div>
      </article>
    </template>

  </body>
</html>
